# Include inside the HTTPS Nginx server serving frontend/dist.
# Review browser CSP reports on public, admin, student and QR pages, then
# change Content-Security-Policy-Report-Only to Content-Security-Policy.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://www.facebook.com https://www.google.com; media-src 'self' blob: https:" always;

# Enable after confirming this origin is HTTPS-only (no subdomain opt-in).
# add_header Strict-Transport-Security "max-age=31536000" always;
# In the PHP FastCGI location also set: fastcgi_hide_header X-Powered-By;
# In php.ini set: expose_php = Off
